<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Mutaba'ah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fdfbf7;
            background-image: 
                linear-gradient(30deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(150deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(30deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(150deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(60deg, #f0ebd877 25%, transparent 25.5%, transparent 75%, #f0ebd877 75%, #f0ebd877), 
                linear-gradient(60deg, #f0ebd877 25%, transparent 25.5%, transparent 75%, #f0ebd877 75%, #f0ebd877);
            background-size: 40px 70px;
            background-position: 0 0, 0 0, 20px 35px, 20px 35px, 0 0, 20px 35px;
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4 font-serif">

    <div class="w-full max-w-md bg-white/95 p-8 rounded-xl shadow-2xl border-4 border-[#c5a059]">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#113f59] mb-2">تسجيل الدخول</h1>
            <p class="text-gray-600 font-semibold border-b-2 border-[#c5a059] pb-4">
                Sistem Mutaba'ah Quran
            </p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-[#113f59] font-bold mb-2">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required 
                    class="w-full border-2 border-[#c5a059] px-4 py-2 rounded outline-none focus:border-[#113f59] bg-[#fdfbf7] transition-colors" 
                    placeholder="Masukkan username">
            </div>

            <div>
                <label class="block text-[#113f59] font-bold mb-2">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" autocomplete="current-password" required 
                        class="w-full border-2 border-[#c5a059] px-4 py-2 pr-12 rounded outline-none focus:border-[#113f59] bg-[#fdfbf7] transition-colors" 
                        placeholder="Masukkan password">
                    <button type="button" onclick="togglePassword('password', 'iconLogin')" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-[#113f59] focus:outline-none">
                        <svg id="iconLogin" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div id="errorMessage" class="text-red-500 font-bold text-sm hidden text-center">
                Username atau password salah!
            </div>

            <button type="submit" 
                class="w-full bg-[#113f59] text-white font-bold px-6 py-3 rounded shadow hover:bg-[#0c2d40] border border-[#c5a059] transition-all">
                Masuk
            </button>
        </form>

        <div class="text-center mt-6">
            <p class="text-sm text-gray-600 font-semibold">
                Belum punya akun? 
                <a href="register.html" class="text-[#c5a059] font-bold hover:text-[#113f59] hover:underline transition-colors">
                    Buat Akun Baru
                </a>
            </p>
        </div>
    </div>

    <script>
        function togglePassword(idInput, idIcon) {
            const input = document.getElementById(idInput);
            const icon = document.getElementById(idIcon);

            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                `;
            } else {
                input.type = 'password';
                icon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                `;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('nama', data.nama);
                    
                    errorMsg.classList.add('hidden');
                    alert(`Selamat datang, ${data.nama}!`);
                    window.location.href = 'menu-utama.html'; 
                } else {
                    errorMsg.innerText = data.error;
                    errorMsg.classList.remove('hidden');
                }
            } catch (error) {
                errorMsg.innerText = "Gagal terhubung ke server.";
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
