<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Mutaba'ah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Pattern background khas Islami */
        body {
            background-color: #fdfbf7;
            background-image: 
                linear-gradient(30deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(150deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(30deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(150deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(60deg, #f0ebd877 25%, transparent 25.5%, transparent 75%, #f0ebd877 75%, #f0ebd877), 
                linear-gradient(60deg, #f0ebd877 25%, transparent 25.5%, transparent 75%, #f0ebd877 75%, #f0ebd877);
            background-size: 40px 70px;
            background-position: 0 0, 0 0, 20px 35px, 20px 35px, 0 0, 20px 35px;
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4 font-serif">

    <!-- Card Login -->
    <div class="w-full max-w-md bg-white/95 p-8 rounded-xl shadow-2xl border-4 border-[#c5a059]">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#113f59] mb-2">تسجيل الدخول</h1>
            <p class="text-gray-600 font-semibold border-b-2 border-[#c5a059] pb-4">
                Sistem Mutaba'ah Quran
            </p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-[#113f59] font-bold mb-2">Username</label>
                <input type="text" id="username" required 
                    class="w-full border-2 border-[#c5a059] px-4 py-2 rounded outline-none focus:border-[#113f59] bg-[#fdfbf7] transition-colors" 
                    placeholder="Masukkan username">
            </div>

            <div>
                <label class="block text-[#113f59] font-bold mb-2">Password</label>
                <input type="password" id="password" required 
                    class="w-full border-2 border-[#c5a059] px-4 py-2 rounded outline-none focus:border-[#113f59] bg-[#fdfbf7] transition-colors" 
                    placeholder="Masukkan password">
            </div>

            <div id="errorMessage" class="text-red-500 font-bold text-sm hidden text-center">
                Username atau password salah!
            </div>

            <button type="submit" 
                class="w-full bg-[#113f59] text-white font-bold px-6 py-3 rounded shadow hover:bg-[#0c2d40] border border-[#c5a059] transition-all">
                Masuk
            </button>
        </form>
        <!-- Tambahkan kode ini tepat di bawah tag </form> -->
        <div class="text-center mt-6">
            <p class="text-sm text-gray-600 font-semibold">
                Belum punya akun? 
                <a href="register.html" class="text-[#c5a059] font-bold hover:text-[#113f59] hover:underline transition-colors">
                    Buat Akun Baru
                </a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Mencegah reload halaman
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            try {
                // Mengirim request ke Backend
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const data = await response.json();

                if (response.ok) {
                    // Simpan token dan data user ke LocalStorage Browser
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('nama', data.nama);
                    
                    errorMsg.classList.add('hidden');
                    
                    // Redirect ke Halaman Menu Utama (Akan kita buat setelah ini)
                    alert(`Selamat datang, ${data.nama}!`);
                    window.location.href = 'menu-utama.html'; 
                } else {
                    // Tampilkan pesan error jika gagal
                    errorMsg.innerText = data.error;
                    errorMsg.classList.remove('hidden');
                }
            } catch (error) {
                errorMsg.innerText = "Gagal terhubung ke server.";
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
