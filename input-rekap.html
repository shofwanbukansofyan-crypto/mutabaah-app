   <!-- Buka file input-rekapan.html, lalu ubah blok <script> di bagian paling bawah dengan ini: -->

    <script>
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');

        if (role !== 'guru' || !token) {
            alert('Akses Ditolak! Hanya Ustadz/Guru yang boleh mengakses halaman ini.');
            window.location.href = 'daftar-rekap.html';
        }

        // 1. Tarik Data Murid saat Halaman Dimuat
        async function loadMurid() {
            try {
                const response = await fetch('/api/murid', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                // Cari div tempat kita menaruh input Pekan dan Tanggal, lalu tambahkan Dropdown Siswa secara dinamis
                const headerForm = document.querySelector('.flex.flex-col.md\\:flex-row.justify-center.gap-6');
                
                let opsiMurid = `<option value="" disabled selected>- Pilih Siswa -</option>`;
                data.forEach(murid => {
                    opsiMurid += `<option value="${murid.id}">${murid.nama_lengkap}</option>`;
                });

                const dropdownHTML = `
                    <div class="flex items-center gap-2">
                        <label>Siswa :</label>
                        <select id="pilihMurid" class="border-b-2 border-[#c5a059] bg-transparent px-2 outline-none focus:border-[#113f59] cursor-pointer">
                            ${opsiMurid}
                        </select>
                    </div>
                `;
                
                // Menyisipkan dropdown di awal form header
                headerForm.insertAdjacentHTML('afterbegin', dropdownHTML);

            } catch (error) {
                console.error("Gagal menarik data murid:", error);
            }
        }
        
        window.onload = loadMurid;

        // 2. Fungsi Tombol Simpan
        document.getElementById('btnSimpan').addEventListener('click', async () => {
            const murid_id = document.getElementById('pilihMurid') ? document.getElementById('pilihMurid').value : null;
            const pekan_ke = document.getElementById('inputPekan').value;
            const tanggal_mulai = document.getElementById('inputTanggal').value;
            const saran = document.getElementById('inputSaran').value;
            const catatan = document.getElementById('inputCatatan').value;

            if(!murid_id) {
                alert("Mohon pilih Siswa terlebih dahulu!");
                return;
            }

            if(!pekan_ke || !tanggal_mulai) {
                alert("Pekan dan Tanggal Mulai wajib diisi!");
                return;
            }

            const data_harian = [];
            const barisTabel = document.querySelectorAll('#tabelHarian tr');
            barisTabel.forEach(baris => {
                const kolom = baris.querySelectorAll('td');
                data_harian.push({
                    nama_hari: kolom[0].innerText,
                    hafalan: kolom[1].querySelector('input').value,
                    nilai_hafalan: kolom[2].querySelector('select').value,
                    murojaah: kolom[3].querySelector('input').value,
                    nilai_murojaah: kolom[4].querySelector('select').value,
                    catatan: kolom[5].querySelector('input').value
                });
            });

            const payload = {
                murid_id: murid_id, // Sekarang kita kirim ID muridnya ke server
                pekan_ke: pekan_ke,
                tanggal_mulai: tanggal_mulai,
                saran_pengembangan: saran,
                catatan_umum: catatan,
                data_harian: data_harian
            };

            try {
                const response = await fetch('http://localhost:3000/api/rekapan', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` // Wajib kirim token untuk membuktikan ini adalah Guru
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (response.ok) {
                    alert('Berhasil disimpan!');
                    window.location.href = 'daftar-rekap.html';
                } else {
                    alert('Gagal: ' + result.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Gagal terhubung ke server. Pastikan backend nyala.');
            }
        });
    </script>
