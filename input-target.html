<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Target Muroja'ah - Ustadz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fdfbf7;
            background-image: 
                linear-gradient(30deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(150deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8);
            background-size: 40px 70px;
        }
    </style>
</head>
<body class="p-4 md:p-8 font-serif">

    <div class="flex justify-between items-center mb-6 border-b-2 border-[#c5a059] pb-4">
            <a href="menu-utama.html" class="text-[#113f59] font-bold hover:underline">&larr; Menu Utama</a>
            <h1 class="text-2xl font-bold text-[#113f59]">Buat Target Muroja'ah Santri</h1>
            
            <!-- Tombol pindah ke halaman Edit -->
            <a href="kelola-target.html" class="bg-[#c5a059] text-[#113f59] font-bold text-sm px-4 py-2 rounded shadow hover:bg-yellow-600 hover:text-white transition-colors">
                Edit Target Lama &rarr;
            </a>
        </div>

        <div class="flex flex-wrap gap-4 mb-6 bg-[#fdfbf7] p-4 rounded-lg border border-[#c5a059]">
            <div class="flex-1 min-w-[200px]">
                <label class="block font-bold text-[#113f59] mb-1">Pilih Santri:</label>
                <select id="pilihMurid" class="w-full border-2 border-[#c5a059] p-2 rounded bg-white outline-none">
                    <option value="" disabled selected>- Memuat Santri -</option>
                </select>
            </div>
            <div class="w-32">
                <label class="block font-bold text-[#113f59] mb-1">Pekan Ke-:</label>
                <input type="number" id="inputPekan" value="1" class="w-full border-2 border-[#c5a059] p-2 rounded bg-white text-center font-bold">
            </div>

            <div class="w-48">
    <label class="block font-bold text-[#113f59] mb-1">Pekan Ke-:</label>
    <div class="flex gap-2">
        <input type="number" id="inputPekan" value="1" class="w-full border-2 border-[#c5a059] p-2 rounded bg-white text-center font-bold">
    </div>
    <span id="infoPekanAktif" class="text-xs text-gray-600 italic block mt-1">Pekan aktif: -</span>
</div>
        </div>

        <div class="space-y-4 mb-6" id="containerHari">
            </div>

        <button id="btnSimpanTarget" class="w-full bg-[#113f59] text-white font-bold py-3 rounded shadow hover:bg-[#0c2d40] border border-[#c5a059]">
            Kirim Target ke Santri
        </button>

    </div>

    <script>

        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        if (role !== 'guru' || !token) { window.location.href = 'login.html'; }

        const daftarHari = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Ahad'];
        const container = document.getElementById('containerHari');

        // Render form input per hari
        daftarHari.forEach(hari => {
            container.innerHTML += `
                <div class="flex flex-col md:flex-row items-center gap-4 bg-[#f0ebd8]/40 p-3 rounded border border-[#c5a059]">
                    <span class="w-24 font-bold text-[#113f59] text-lg">${hari}</span>
                    <input type="text" data-hari="${hari}" placeholder="Contoh: Muroja'ah Surah Al-Mulk ayat 1-15 dengan lancar" 
                        class="input-target flex-1 w-full border border-[#c5a059] p-2 rounded bg-white outline-none focus:ring-1 focus:ring-[#113f59]">
                </div>
            `;
        });

        // Ambil daftar murid
        async function loadMurid() {
            try {
                const res = await fetch('/api/murid', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const select = document.getElementById('pilihMurid');
                select.innerHTML = '<option value="" disabled selected>- Pilih Santri -</option>';
                data.forEach(m => {
                    select.innerHTML += `<option value="${m.id}">${m.nama_lengkap}</option>`;
                });
            } catch (err) {
                console.error("Gagal memuat data murid:", err);
            }
        }
        loadMurid();

        // EVENT LISTENER: Otomatis deteksi pekan aktif saat Santri dipilih
        document.getElementById('pilihMurid').addEventListener('change', async function() {
            const muridId = this.value;
            if (!muridId) return;

            try {
                // Ambil semua data target milik Santri ini untuk mencari pekan terakhirnya
                const res = await fetch(`/api/target?murid_id=${muridId}`, { 
                    headers: { 'Authorization': `Bearer ${token}` } 
                });
                const data = await res.json();

                const inputPekan = document.getElementById('inputPekan');

                if (data && data.length > 0) {
                    // Cari nilai pekan terbesar yang sudah pernah diinput guru untuk Santri ini
                    const pekanMaksimal = Math.max(...data.map(item => Number(item.pekan_ke) || 1));
                    
                    // Otomatis arahkan ke pekan berikutnya, atau tetap di pekan maksimal jika belum ada data baru
                    inputPekan.value = pekanMaksimal + 1;
                } else {
                    // Jika Santri belum punya target sama sekali, mulai dari Pekan 1
                    inputPekan.value = 1;
                }
            } catch (err) {
                console.error("Gagal mendeteksi pekan aktif santri:", err);
            }
        });

        // Tombol Simpan
        document.getElementById('btnSimpanTarget').addEventListener('click', async () => {
            const murid_id = document.getElementById('pilihMurid').value;
            const pekan_ke = document.getElementById('inputPekan').value;

            if (!murid_id) { alert('Pilih santri terlebih dahulu!'); return; }

            const targets = [];
            document.querySelectorAll('.input-target').forEach(input => {
                targets.push({
                    hari: input.getAttribute('data-hari'),
                    isi_target: input.value || '-'
                });
            });

            try {
                const res = await fetch('/api/target', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ murid_id, pekan_ke, targets })
                });

                const result = await res.json();
                if (res.ok) {
                    alert(result.message);
                    window.location.href = 'menu-utama.html';
                } else {
                    alert('Gagal: ' + result.error);
                }
            } catch (err) {
                alert('Terjadi kesalahan jaringan.');
            }
        });

    </script>
</body>
</html>
