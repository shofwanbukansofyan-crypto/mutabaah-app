<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Rekapan Hafalan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fdfbf7;
            background-image: 
                linear-gradient(30deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(150deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(30deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(150deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(60deg, #f0ebd877 25%, transparent 25.5%, transparent 75%, #f0ebd877 75%, #f0ebd877), 
                linear-gradient(60deg, #f0ebd877 25%, transparent 25.5%, transparent 75%, #f0ebd877 75%, #f0ebd877);
            background-size: 40px 70px;
            background-position: 0 0, 0 0, 20px 35px, 20px 35px, 0 0, 20px 35px;
        }
    </style>
</head>
<body class="p-4 md:p-8 text-sm md:text-base font-serif">

    <div class="max-w-5xl mx-auto bg-white/95 p-6 rounded-xl shadow-lg border-2 border-[#c5a059]">
        
        <div class="flex justify-between items-start mb-6 border-b-2 border-[#c5a059] pb-4">
            <a href="menu-utama.html" class="text-[#113f59] font-bold hover:underline flex items-center gap-1">
                &larr; Kembali ke Menu
            </a>
            <div class="text-center flex-1">
                <div class="inline-block bg-[#113f59] text-white px-8 py-2 rounded-[2rem] shadow-md border-2 border-[#c5a059]">
                    <h1 class="text-xl font-bold">Daftar Mutaba'ah Mingguan</h1>
                </div>
            </div>
            <div class="w-24"></div> <!-- Spacer biar judul tetap di tengah -->
        </div>

        <div class="overflow-x-auto mb-6">
            <table class="w-full text-center border-collapse border-4 border-[#c5a059] min-w-[600px]">
                <thead class="bg-[#113f59] text-white">
                    <tr>
                        <th class="border border-[#c5a059] p-3 w-[15%]">Pekan Ke-</th>
                        <th class="border border-[#c5a059] p-3 w-[25%]">Tanggal Mulai</th>
                        <th class="border border-[#c5a059] p-3 w-[45%] text-left">Pencapaian Terbaik</th>
                        <th class="border border-[#c5a059] p-3 w-[15%]">Aksi</th>
                    </tr>
                </thead>
                <!-- Bagian ini yang kita kosongkan -->
                <tbody id="tabelData" class="text-[#113f59] bg-[#fdfbf7]">
                    <tr>
                        <td colspan="4" class="border border-[#c5a059] p-8 text-center text-gray-500 italic font-semibold">
                            Belum ada data rekapan mingguan.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="flex justify-between items-center mt-6">
            <p class="text-sm text-gray-500 italic">*Menampilkan histori hafalan</p>
            
            <!-- Tombol ini hanya akan muncul jika yang login adalah GURU -->
            <a href="input-rekap.html" id="btnInputBaru" class="hidden bg-[#113f59] text-white font-bold px-6 py-2 rounded shadow-lg hover:bg-[#0c2d40] border border-[#c5a059] transition-all">
                + Input Rekapan Baru
            </a>
        </div>
        
    </div>
<script>
        // 1. Pengecekan Akses (Gatekeeper) & Ambil Token
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        
        if (!token) {
            window.location.href = 'login.html';
        }

        // Tampilkan tombol Input jika yang login adalah Guru
        if (role === 'guru') {
            document.getElementById('btnInputBaru').classList.remove('hidden');
        }

        // 2. Fungsi untuk Menarik Data dari Database
        async function loadDataRekapan() {
            try {
                // Minta data ke server, jangan lupa bawa "kunci" tokennya
                const response = await fetch('http://localhost:3000/api/rekapan', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();
                const tabelData = document.getElementById('tabelData');

                if (response.ok) {
                    // Kalau datanya kosong
                    if (data.length === 0) {
                        tabelData.innerHTML = `
                            <tr>
                                <td colspan="4" class="border border-[#c5a059] p-8 text-center text-gray-500 italic font-semibold">
                                    Belum ada data rekapan mingguan.
                                </td>
                            </tr>
                        `;
                        return;
                    }

                    // Kalau ada datanya, kosongkan dulu isi tabel bawaan HTML
                    tabelData.innerHTML = '';

                    // Looping data dan masukkan satu-satu ke dalam tabel
                    data.forEach(baris => {
                        // Kalau pencapaian kosong, kasih strip (-)
                        const pencapaian = baris.pencapaian_terbaik ? baris.pencapaian_terbaik : '-';
                        
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-[#f0ebd8]/80 transition-colors text-center";
                        tr.innerHTML = `
                            <td class="border border-[#c5a059] p-3 font-bold text-lg">${baris.pekan_ke}</td>
                            <td class="border border-[#c5a059] p-3">${baris.tanggal_mulai}</td>
                            <td class="border border-[#c5a059] p-3 text-left font-bold">${pencapaian}</td>
                            <td class="border border-[#c5a059] p-3">
                                <a href="detail-rekap.html?id=${baris.id}" class="bg-[#c5a059] text-[#113f59] font-bold px-3 py-1 rounded hover:bg-yellow-600 hover:text-white transition-colors text-sm shadow">Lihat</a>
                            </td>
                        `;
                        tabelData.appendChild(tr);
                    });

                } else {
                    console.error("Gagal mengambil data:", data.error);
                }
            } catch (error) {
                console.error("Error jaringan:", error);
                document.getElementById('tabelData').innerHTML = `
                    <tr>
                        <td colspan="4" class="border border-[#c5a059] p-8 text-center text-red-500 font-bold">
                            Gagal terhubung ke Server.
                        </td>
                    </tr>
                `;
            }
        }

        // Jalankan fungsi narik data saat halaman pertama kali dibuka
        window.onload = loadDataRekapan;
    </script>
</body>
</html>
