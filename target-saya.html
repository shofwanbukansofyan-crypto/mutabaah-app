<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Muroja'ah Saya - Siswa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fdfbf7;
            background-image: 
                linear-gradient(30deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(150deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8);
            background-size: 40px 70px;
        }
    </style>
</head>
<body class="p-4 md:p-8 font-serif">

    <div class="max-w-3xl mx-auto bg-white/95 p-6 rounded-xl shadow-lg border-2 border-[#c5a059]">
        
        <div class="flex justify-between items-center mb-6 border-b-2 border-[#c5a059] pb-4">
            <a href="menu-utama.html" class="text-[#113f59] font-bold hover:underline">&larr; Menu Utama</a>
            <h1 class="text-2xl font-bold text-[#113f59]">Target Muroja'ah Pekanan</h1>
            <div class="w-20"></div>
        </div>

        <div class="flex justify-center items-center gap-3 mb-6 bg-[#fdfbf7] p-3 rounded-lg border border-[#c5a059]">
            <label class="font-bold text-[#113f59]">Pilih Pekan:</label>
            <input type="number" id="filterPekan" value="1" class="w-20 border-2 border-[#c5a059] p-1 rounded text-center font-bold outline-none">
            <button onclick="loadTargetSaya()" class="bg-[#c5a059] text-[#113f59] font-bold px-4 py-1 rounded shadow hover:bg-yellow-600 hover:text-white">Lihat</button>
        </div>

        <div id="listTarget" class="space-y-3">
            <p class="text-center text-gray-500 italic">Memuat target...</p>
        </div>

    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = 'login.html'; }

        async function loadTargetSaya() {
            const pekan = document.getElementById('filterPekan').value;
            const res = await fetch(`/api/target`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const container = document.getElementById('listTarget');

            if (data.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 italic py-6">Belum ada target untuk pekan ke-${pekan}.</p>`;
                return;
            }

            container.innerHTML = '';
            data.forEach(item => {
                const isChecked = item.status_selesai === 1 ? 'checked' : '';
                const styleCoret = item.status_selesai === 1 ? 'line-through text-gray-400' : 'text-[#113f59]';

                container.innerHTML += `
                    <div class="flex items-center justify-between bg-[#f0ebd8]/50 p-4 rounded-lg border border-[#c5a059] transition-all">
                        <div class="flex items-center gap-4 flex-1">
                            <span class="w-20 font-bold text-[#113f59]">${item.hari}</span>
                            <span id="text-${item.id}" class="flex-1 font-semibold ${styleCoret}">${item.isi_target}</span>
                        </div>
                        <label class="flex items-center cursor-pointer gap-2">
                            <span class="text-sm font-bold text-gray-600">Selesai</span>
                            <input type="checkbox" ${isChecked} onchange="updateStatus(${item.id}, this.checked)" 
                                class="w-5 h-5 text-[#113f59] border-[#c5a059] rounded cursor-pointer">
                        </label>
                    </div>
                `;
            });
        }

        async function updateStatus(id, status) {
            const status_selesai = status ? 1 : 0;
            await fetch(`/api/target`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ status_selesai })
            });
            loadTargetSaya(); // Muat ulang tampilan agar efek coretnya pas
        }

        window.onload = loadTargetSaya;
    </script>
</body>
</html>
