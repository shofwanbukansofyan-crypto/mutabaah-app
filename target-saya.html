<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Muroja'ah Saya - Siswa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fdfbf7;
            background-image: 
                linear-gradient(30deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(150deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8);
            background-size: 40px 70px;
        }
    </style>
</head>
<body class="p-4 md:p-8 font-serif">

    <div class="max-w-3xl mx-auto bg-white/95 p-6 rounded-xl shadow-lg border-2 border-[#c5a059]">
        
        <div class="flex justify-between items-center mb-6 border-b-2 border-[#c5a059] pb-4">
            <a href="menu-utama.html" class="text-[#113f59] font-bold hover:underline">&larr; Menu Utama</a>
            <h1 class="text-2xl font-bold text-[#113f59]">Target Muroja'ah Pekanan</h1>
            <div class="w-20"></div>
        </div>

        <!-- Indikator Pekan Aktif & Progress Bar -->
<div class="mb-6 bg-[#fdfbf7] p-4 rounded-lg border border-[#c5a059]">
    <div class="flex justify-between items-center mb-2">
        <span class="font-bold text-[#113f59]">Progres Pekan Ini:</span>
        <span id="textProgres" class="font-bold text-[#c5a059]">0 / 0 Selesai (0%)</span>
    </div>
    <div class="w-full bg-gray-200 rounded-full h-3 border border-[#c5a059]/40 overflow-hidden">
        <div id="progressBar" class="bg-[#113f59] h-full transition-all duration-300" style="width: 0%"></div>
    </div>
</div>

        <div class="text-center mb-4">
    <span class="bg-[#113f59] text-white text-xs px-3 py-1 rounded-full font-semibold">
        📅 Pekan Aktif Saat Ini: <span id="labelPekanAktif" class="text-[#c5a059] font-bold">-</span>
    </span>
</div>

        <div class="flex justify-center items-center gap-3 mb-6 bg-[#fdfbf7] p-3 rounded-lg border border-[#c5a059]">
            <label class="font-bold text-[#113f59]">Pilih Pekan:</label>
            <input type="number" id="filterPekan" value="1" class="w-20 border-2 border-[#c5a059] p-1 rounded text-center font-bold outline-none">
            <button onclick="loadTargetSaya()" class="bg-[#c5a059] text-[#113f59] font-bold px-4 py-1 rounded shadow hover:bg-yellow-600 hover:text-white">Lihat</button>
        </div>

        <div id="listTarget" class="space-y-3">
            <p class="text-center text-gray-500 italic">Memuat target...</p>
        </div>

    </div>

  <script>
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = 'login.html'; }

        // Jalankan saat halaman pertama kali dimuat
        window.onload = function() {
            cekPekanAktif();
        };

        async function loadTargetSaya() {
            const pekan = document.getElementById('filterPekan').value;
            const container = document.getElementById('listTarget');
            container.innerHTML = '<p class="text-center text-gray-500 italic">Memuat target...</p>';

            try {
                const res = await fetch(`/api/target?pekan_ke=${pekan}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) {
                    container.innerHTML = `<p class="text-center text-red-500 italic py-6">Belum ada target untuk pekan ke-${pekan}.</p>`;
                    updateProgress(0, 0);
                    return;
                }

                const data = await res.json();

                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = `<p class="text-center text-gray-500 italic py-6">Belum ada target untuk pekan ke-${pekan}.</p>`;
                    updateProgress(0, 0);
                    return;
                }

                // Urutkan hari dari Senin sampai Ahad
                const urutanHari = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Ahad'];
                data.sort((a, b) => urutanHari.indexOf(a.hari) - urutanHari.indexOf(b.hari));

                let selesaiCount = 0;
                container.innerHTML = '';
                
                data.forEach(item => {
                    if (Number(item.status_selesai) === 1) selesaiCount++;
                    const isChecked = Number(item.status_selesai) === 1 ? 'checked' : '';
                    const styleCoret = Number(item.status_selesai) === 1 ? 'line-through text-gray-400' : 'text-[#113f59]';

                    container.innerHTML += `
                        <div class="flex items-center justify-between bg-[#f0ebd8]/50 p-4 rounded-lg border border-[#c5a059] transition-all">
                            <div class="flex items-center gap-4 flex-1">
                                <span class="w-20 font-bold text-[#113f59]">${item.hari}</span>
                                <span id="text-${item.id}" class="flex-1 font-semibold ${styleCoret}">${item.isi_target}</span>
                            </div>
                            <label class="flex items-center cursor-pointer gap-2">
                                <span class="text-sm font-bold text-gray-600">Selesai</span>
                                <input type="checkbox" ${isChecked} onchange="updateStatus(${item.id}, this.checked)" 
                                    class="w-5 h-5 text-[#113f59] border-[#c5a059] rounded cursor-pointer">
                            </label>
                        </div>
                    `;
                });

                updateProgress(selesaiCount, data.length);
            } catch (err) {
                console.error("Gagal memuat target:", err);
                container.innerHTML = `<p class="text-center text-gray-500 italic py-6">Belum ada target untuk pekan ke-${pekan}.</p>`;
                updateProgress(0, 0);
            }
        }

        async function cekPekanAktif() {
            try {
                const res = await fetch(`/api/target/pekan-aktif`, { 
                    headers: { 'Authorization': `Bearer ${token}` } 
                });
                
                if (res.ok) {
                    const data = await res.json();
                    const pekanMaksimal = data.pekan_aktif || 1;
                    
                    const labelPekan = document.getElementById('labelPekanAktif');
                    if (labelPekan) {
                        labelPekan.innerText = `Pekan ke-${pekanMaksimal}`;
                    }
                    
                    document.getElementById('filterPekan').value = pekanMaksimal;
                }
                
                loadTargetSaya();
            } catch (err) {
                console.error("Gagal mendeteksi pekan aktif:", err);
                loadTargetSaya();
            }
        }

        function updateProgress(selesai, total) {
            const progressBar = document.getElementById('progressBar');
            const textProgres = document.getElementById('textProgres');
            
            if (progressBar && textProgres) {
                const persen = total === 0 ? 0 : Math.round((selesai / total) * 100);
                progressBar.style.width = `${persen}%`;
                textProgres.innerText = `${selesai} dari ${total} Selesai (${persen}%)`;
            }
        }

        async function updateStatus(id, status) {
            const status_selesai = status ? 1 : 0;
            await fetch(`/api/target/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ status_selesai })
            });
            loadTargetSaya();
        }

    </script>
</body>
</html>
