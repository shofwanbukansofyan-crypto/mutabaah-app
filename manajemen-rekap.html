<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Rekap Mutaba'ah - Sistem Mutaba'ah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fdfbf7;
            background-image: 
                linear-gradient(30deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8),
                linear-gradient(150deg, #f0ebd8 12%, transparent 12.5%, transparent 87%, #f0ebd8 87.5%, #f0ebd8);
            background-size: 40px 70px;
        }
    </style>
</head>
<body class="p-2 md:p-8 text-sm md:text-base font-serif">

    <div class="max-w-6xl mx-auto bg-white/95 p-4 md:p-6 rounded-xl shadow-lg border-2 border-[#c5a059]">
        
        <!-- HEADER UTAMA & NAVIGASI -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b-2 border-[#c5a059] gap-4">
            <a href="menu-utama.html" class="text-[#113f59] font-bold hover:underline flex items-center gap-1 text-sm md:text-base">
                &larr; Menu Utama
            </a>
            <div class="text-center flex-1">
                <div class="inline-block bg-[#113f59] text-white px-6 md:px-10 py-2 rounded-[2rem] shadow-md border-2 border-[#c5a059]">
                    <h1 class="text-xl md:text-2xl font-bold">سجيل متابعة الحفظ والمراجعة</h1>
                </div>
            </div>
            <div class="w-0 md:w-24"></div>
        </div>

        <!-- ================= VIEW 1: DAFTAR REKAP (HALAMAN UTAMA) ================= -->
        <div id="viewDaftar" class="space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-[#fdfbf7] p-4 rounded-lg border border-[#c5a059]">
                <h2 class="text-lg md:text-xl font-bold text-[#113f59]">Daftar Rekapan Hafalan & Muroja'ah</h2>
                <!-- Tombol Buat Baru (Hanya Tampil untuk Guru) -->
                <button id="btnBukaInput" onclick="bukaFormInput()" class="hidden bg-[#113f59] text-white font-bold px-5 py-2 rounded shadow hover:bg-[#0c2d40] border border-[#c5a059] text-sm">
                    + Buat Rekapan Baru
                </button>
            </div>

            <div class="bg-white p-4 rounded-lg border border-[#c5a059] overflow-x-auto shadow-inner">
                <table class="w-full border-collapse border border-[#c5a059] text-center text-sm min-w-[600px]">
                    <thead>
                        <tr class="bg-[#113f59] text-white">
                            <th class="border border-[#c5a059] p-2">No</th>
                            <th class="border border-[#c5a059] p-2">Nama Santri</th>
                            <th class="border border-[#c5a059] p-2">Pekan Ke-</th>
                            <th class="border border-[#c5a059] p-2">Tanggal Mulai</th>
                            <th class="border border-[#c5a059] p-2">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelDaftarRekap">
                        <tr><td colspan="5" class="p-4 text-gray-500 italic">Memuat daftar rekapan...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ================= VIEW 2: FORM INPUT & DETAIL/EDIT REKAP ================= -->
        <div id="viewForm" class="hidden space-y-6">
            <div class="flex justify-between items-center pb-2 border-b">
                <button onclick="kembaliKeDaftar()" class="text-[#113f59] font-bold hover:underline text-sm">&larr; Kembali ke Daftar</button>
                <h2 id="formTitle" class="text-lg font-bold text-[#113f59]">Form Rekapan</h2>
                <div class="w-20"></div>
            </div>

            <div class="flex flex-col md:flex-row justify-center gap-4 text-[#113f59] font-bold text-sm md:text-base">
                <div id="wrapperPilihMurid" class="flex items-center gap-2 hidden">
                    <label>Santri :</label>
                    <select id="pilihMurid" class="border-b-2 border-[#c5a059] bg-transparent px-2 outline-none focus:border-[#113f59] cursor-pointer text-[#c5a059]">
                        <option value="" disabled selected>- Pilih Santri -</option>
                    </select>
                </div>
                <div id="wrapperViewNama" class="flex items-center gap-2 hidden">
                    <span>Santri : </span><span id="viewNamaSantri" class="text-[#c5a059] font-bold">-</span>
                </div>
                <div class="flex items-center gap-2">
                    <label>Pekan Ke- :</label>
                    <input type="number" id="inputPekan" class="border-b-2 border-[#c5a059] bg-transparent px-2 w-20 text-center outline-none focus:border-[#113f59]">
                </div>
                <div class="flex items-center gap-2">
                    <label>Tanggal Mulai :</label>
                    <input type="date" id="inputTanggal" class="border-b-2 border-[#c5a059] bg-transparent px-2 outline-none focus:border-[#113f59]">
                </div>
            </div>

            <!-- Tabel Harian -->
            <div class="overflow-x-auto shadow-inner rounded">
                <table class="w-full text-right border-collapse border-4 border-[#c5a059] min-w-[750px]" dir="rtl">
                    <thead class="bg-[#113f59] text-white">
                        <tr>
                            <th class="border border-[#c5a059] p-3 w-[12%]">اليوم</th>
                            <th class="border border-[#c5a059] p-3 w-[22%]">الحفظ</th>
                            <th class="border border-[#c5a059] p-3 w-[15%]">تقدير</th>
                            <th class="border border-[#c5a059] p-3 w-[22%]">المراجعة</th>
                            <th class="border border-[#c5a059] p-3 w-[15%]">تقدير</th>
                            <th class="border border-[#c5a059] p-3 w-[14%]">ملاحظات</th>
                        </tr>
                    </thead>
                    <tbody id="tabelHarian" class="text-[#113f59] bg-[#fdfbf7]">
                        <!-- Dirender dinamis -->
                    </tbody>
                </table>
            </div>

            <!-- Evaluasi Guru -->
            <div class="border-2 border-[#c5a059] p-4 md:p-5 rounded-lg bg-[#fdfbf7] text-left text-[#113f59]" dir="ltr">
                <h3 class="text-base md:text-lg font-bold mb-3 border-b-2 border-[#c5a059] pb-2 text-center">Evaluasi / Saran Guru</h3>
                <div class="mb-3 flex flex-col md:flex-row md:items-center gap-2">
                    <label class="md:w-1/3 font-semibold text-sm">Pencapaian Terbaik / Saran :</label>
                    <input type="text" id="inputSaran" class="md:w-2/3 border-b border-dashed border-[#113f59] bg-transparent outline-none py-1 focus:bg-[#f0ebd8]">
                </div>
                <div class="flex flex-col md:flex-row md:items-center gap-2">
                    <label class="md:w-1/3 font-semibold text-sm">Catatan Umum :</label>
                    <input type="text" id="inputCatatan" class="md:w-2/3 border-b border-dashed border-[#113f59] bg-transparent outline-none py-1 focus:bg-[#f0ebd8]">
                </div>
            </div>

            <!-- Tombol Simpan / Hapus -->
            <div class="mt-6 text-center flex flex-col md:flex-row justify-center gap-4">
                <button id="btnSimpan" class="bg-[#113f59] text-white font-bold px-8 py-2.5 rounded shadow hover:bg-[#0c2d40] border border-[#c5a059] transition-all text-sm">
                    Simpan Rekapan
                </button>
                <button id="btnHapus" class="bg-red-700 text-white font-bold px-6 py-2.5 rounded shadow hover:bg-red-800 border border-red-900 transition-all text-sm hidden">
                    Hapus Rekapan
                </button>
            </div>
        </div>

    </div>

    <script>
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        if (!token) { window.location.href = 'login.html'; }

        const daftarHariArab = [
            { nama: 'الإثنين', en: 'Senin' },
            { nama: 'الثلاثاء', en: 'Selasa' },
            { nama: 'الأربعاء', en: 'Rabu' },
            { nama: 'الخميس', en: 'Kamis' },
            { nama: 'الجمعة', en: 'Jumat' },
            { nama: 'السبت', en: 'Sabtu' },
            { nama: 'الأحد', en: 'Ahad' }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get('action');
        const rekapanId = urlParams.get('id');

        window.onload = async function() {
            if (role === 'guru') {
                document.getElementById('btnBukaInput').classList.remove('hidden');
            }

            if (action === 'input' || rekapanId) {
                // Tampilkan Form
                document.getElementById('viewDaftar').classList.add('hidden');
                document.getElementById('viewForm').classList.remove('hidden');

                if (rekapanId) {
                    document.getElementById('formTitle').innerText = "Detail & Edit Rekapan";
                    document.getElementById('wrapperViewNama').classList.remove('hidden');
                    if (role === 'guru') document.getElementById('btnHapus').classList.remove('hidden');
                    await loadDetailRekapan(rekapanId);
                } else {
                    if (role !== 'guru') { alert('Akses ditolak!'); kembaliKeDaftar(); return; }
                    document.getElementById('formTitle').innerText = "Buat Rekapan Baru";
                    document.getElementById('wrapperPilihMurid').classList.remove('hidden');
                    await loadDaftarMurid();
                    renderTabelForm([]);
                }
            } else {
                // Tampilkan Daftar
                await loadDaftarRekapan();
            }
        };

        function kembaliKeDaftar() {
            window.location.href = 'manajemen-rekap.html';
        }

        function bukaFormInput() {
            window.location.href = 'manajemen-rekap.html?action=input';
        }

        // ================= 1. LOGIKA DAFTAR REKAP =================
        async function loadDaftarRekapan() {
            const tbody = document.getElementById('tabelDaftarRekap');
            try {
                const res = await fetch('/api/rekapan', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();

                if (!Array.isArray(data) || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-gray-500 italic">Belum ada riwayat rekapan.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                data.forEach((item, index) => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-[#f0ebd8]/40 border-b">
                            <td class="p-2 border">${index + 1}</td>
                            <td class="p-2 border font-bold text-[#113f59]">${item.nama_murid || '-'}</td>
                            <td class="p-2 border">Pekan ke-${item.pekan_ke}</td>
                            <td class="p-2 border">${item.tanggal_mulai}</td>
                            <td class="p-2 border">
                                <a href="manajemen-rekap.html?id=${item.id}" class="bg-[#113f59] text-white px-3 py-1 rounded text-xs font-bold hover:bg-[#0c2d40]">Lihat / Edit</a>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-red-500 italic">Gagal memuat daftar rekapan.</td></tr>`;
            }
        }

        // ================= 2. LOGIKA FORM (INPUT / EDIT) =================
        async function loadDaftarMurid() {
            try {
                const res = await fetch('/api/murid', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const select = document.getElementById('pilihMurid');
                select.innerHTML = '<option value="" disabled selected>- Pilih Santri -</option>';
                data.forEach(m => {
                    select.innerHTML += `<option value="${m.id}">${m.nama_lengkap}</option>`;
                });
            } catch (err) { console.error(err); }
        }

        async function loadDetailRekapan(id) {
            try {
                const res = await fetch(`/api/rekapan/${id}`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (!res.ok) { alert('Data tidak ditemukan'); kembaliKeDaftar(); return; }

                const m = data.mingguan;
                document.getElementById('viewNamaSantri').innerText = m.nama_murid || 'Santri';
                document.getElementById('inputPekan').value = m.pekan_ke;
                document.getElementById('inputTanggal').value = m.tanggal_mulai;
                document.getElementById('inputSaran').value = m.pencapaian_terbaik || '';
                document.getElementById('inputCatatan').value = m.catatan_umum || '';

                if (role !== 'guru') {
                    document.getElementById('inputPekan').disabled = true;
                    document.getElementById('inputTanggal').disabled = true;
                    document.getElementById('inputSaran').disabled = true;
                    document.getElementById('inputCatatan').disabled = true;
                    document.getElementById('btnSimpan').style.display = 'none';
                }

                renderTabelForm(data.harian);
            } catch (err) { console.error(err); }
        }

        function renderTabelForm(dataHarian) {
            const tbody = document.getElementById('tabelHarian');
            tbody.innerHTML = '';

            const urutanHari = ['الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت', 'الأحد'];
            if (dataHarian.length > 0) {
                dataHarian.sort((a, b) => urutanHari.indexOf(a.hari || a.nama_hari) - urutanHari.indexOf(b.hari || b.nama_hari));
            }

            daftarHariArab.forEach(hariObj => {
                const existing = dataHarian.find(d => (d.hari === hariObj.nama || d.nama_hari === hariObj.nama)) || {};
                const isReadonly = (role !== 'guru') ? 'disabled' : '';

                tbody.innerHTML += `
                    <tr class="hover:bg-[#f0ebd8]/50 transition-colors bg-[#fdfbf7]" data-hari="${hariObj.nama}">
                        <td class="border border-[#c5a059] p-2 font-bold text-center">${hariObj.nama}</td>
                        <td class="border border-[#c5a059] p-0"><input type="text" ${isReadonly} class="input-hafalan w-full h-full p-2 bg-transparent outline-none focus:bg-[#f0ebd8]" value="${existing.hafalan_surah_ayat || ''}" placeholder="Surah/Ayat..."></td>
                        <td class="border border-[#c5a059] p-0">
                            <select ${isReadonly} class="select-nilai-hafalan w-full h-full p-2 bg-transparent outline-none cursor-pointer">
                                <option value="">- Nilai -</option>
                                <option value="ممتاز" ${existing.nilai_hafalan === 'ممتاز' ? 'selected' : ''}>ممتاز</option>
                                <option value="جيد جدا" ${existing.nilai_hafalan === 'جيد جدا' ? 'selected' : ''}>جيد جدا</option>
                                <option value="جيد" ${existing.nilai_hafalan === 'جيد' ? 'selected' : ''}>جيد</option>
                            </select>
                        </td>
                        <td class="border border-[#c5a059] p-0"><input type="text" ${isReadonly} class="input-murojaah w-full h-full p-2 bg-transparent outline-none focus:bg-[#f0ebd8]" value="${existing.murojaah_surah_ayat || ''}" placeholder="Surah/Ayat..."></td>
                        <td class="border border-[#c5a059] p-0">
                            <select ${isReadonly} class="select-nilai-murojaah w-full h-full p-2 bg-transparent outline-none cursor-pointer">
                                <option value="">- Nilai -</option>
                                <option value="ممتاز" ${existing.nilai_murojaah === 'ممتاز' ? 'selected' : ''}>ممتاز</option>
                                <option value="جيد جدا" ${existing.nilai_murojaah === 'جيد جدا' ? 'selected' : ''}>جيد جدا</option>
                                <option value="جيد" ${existing.nilai_murojaah === 'جيد' ? 'selected' : ''}>جيد</option>
                            </select>
                        </td>
                        <td class="border border-[#c5a059] p-0"><input type="text" ${isReadonly} class="input-catatan w-full h-full p-2 bg-transparent outline-none focus:bg-[#f0ebd8]" value="${existing.catatan_harian || ''}" placeholder="..."></td>
                    </tr>
                `;
            });
        }

        // Tombol Simpan (Otomatis deteksi buat baru atau edit)
        document.getElementById('btnSimpan').addEventListener('click', async () => {
            if (role !== 'guru') return;

            const pekan_ke = document.getElementById('inputPekan').value;
            const tanggal_mulai = document.getElementById('inputTanggal').value;
            const saran_pengembangan = document.getElementById('inputSaran').value;
            const catatan_umum = document.getElementById('inputCatatan').value;

            if (!pekan_ke || !tanggal_mulai) { alert("Pekan dan Tanggal Mulai wajib diisi!"); return; }

            const data_harian = [];
            document.querySelectorAll('#tabelHarian tr').forEach(baris => {
                const hari = baris.getAttribute('data-hari');
                const hafalan = baris.querySelector('.input-hafalan').value;
                const nilai_hafalan = baris.querySelector('.select-nilai-hafalan').value;
                const murojaah = baris.querySelector('.input-murojaah').value;
                const nilai_murojaah = baris.querySelector('.select-nilai-murojaah').value;
                const catatan = baris.querySelector('.input-catatan').value;
                data_harian.push({ nama_hari: hari, hafalan, nilai_hafalan, murojaah, nilai_murojaah, catatan });
            });

            if (rekapanId) {
                // UPDATE
                try {
                    const res = await fetch(`/api/rekapan/${rekapanId}/edit`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ pekan_ke, tanggal_mulai, saran_pengembangan, catatan_umum, data_harian })
                    });
                    const result = await res.json();
                    if (res.ok) { alert(result.message); kembaliKeDaftar(); } else { alert('Gagal: ' + result.error); }
                } catch (err) { alert('Terjadi kesalahan jaringan.'); }
            } else {
                // CREATE
                const murid_id = document.getElementById('pilihMurid').value;
                if (!murid_id) { alert("Mohon pilih Santri terlebih dahulu!"); return; }

                try {
                    const res = await fetch('/api/rekapan', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ murid_id, pekan_ke, tanggal_mulai, saran_pengembangan, catatan_umum, data_harian })
                    });
                    const result = await res.json();
                    if (res.ok) { alert(result.message); kembaliKeDaftar(); } else { alert('Gagal: ' + result.error); }
                } catch (err) { alert('Gagal terhubung ke server.'); }
            }
        });

        // Tombol Hapus Rekapan
        document.getElementById('btnHapus').addEventListener('click', async () => {
            if (!confirm("Yakin ingin menghapus rekapan mingguan ini?")) return;
            try {
                const res = await fetch(`/api/rekapan/${rekapanId}/delete`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await res.json();
                if (res.ok) { alert(result.message); kembaliKeDaftar(); } else { alert('Gagal: ' + result.error); }
            } catch (err) { alert('Terjadi kesalahan jaringan.'); }
        });
    </script>
</body>
</html>
